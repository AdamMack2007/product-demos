- name: Notify Mattermost
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Send Mattermost notification
      community.general.mattermost:
        url: "{{ mattermost_url }}"
        api_key: "{{ mattermost_token }}"
        text: "{{ mattermost_message }}"
        username: amack
        channel: "DevOps"