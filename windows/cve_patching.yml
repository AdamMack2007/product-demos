---
- name: Windows updates
  hosts: all
  gather_facts: false

  tasks:
    - name: Check whether a specific KB is installed
      ansible.windows.win_powershell:
        script: |
          $kb = "{{ item }}"
          $hotfix = Get-HotFix -Id $kb -ErrorAction SilentlyContinue
          [PSCustomObject]@{
            KB        = $kb
            Installed = ($null -ne $hotfix)
          }
      register: kb_status
      loop: "{{ cve_required_updates | default([]) }}"
      changed_when: false

    - name: Set install state as fact
      ansible.builtin.set_fact:
        kb_install_state: "{{ kb_status.results[0].output[0].Installed }}"
    
    - name: Check for update
      when: not kb_install_state
      block:
        - name: Check if update is available on host
          when: cve_update_search is defined
          ansible.windows.win_updates:
            reboot: "false"
            category_names: "*"
            accept_list: "{{ cve_required_updates | default([]) }}"
            state: searched
          register: patchingresult
          check_mode: true

        - name: Set patching result as stat
          ansible.builtin.set_stats:
            data:
              patchingresult: "{{ patchingresult }}"

    - name: Patch Windows Server Block
      when: cve_update_search is undefined
      block:
        - name: Create Temp Directory
          ansible.windows.win_file:
            path: C:\Temp
            state: directory

        - name: Patch windows server
          ansible.builtin.include_role:
            name: demo.patching.patch_windows

        - name: Build report server
          ansible.builtin.include_role:
            name: demo.patching.report_windows_patching      

        - name: Fetch report
          ansible.builtin.fetch:
            src: "C:\\Temp\\windowspatch.html"
            dest: "/tmp/{{ inventory_hostname }}_windowspatch.html"
            flat: yes
          delegate_to: "{{ inventory_hostname }}"

