---
- name: Windows updates
  hosts: all
  gather_facts: false

  tasks:
    - name: Patch Windows Server Block
      block:
        - name: Create Temp Directory
          ansible.windows.win_file:
            path: C:\Temp
            state: directory

        - name: Patch windows server
          ansible.builtin.include_role:
            name: demo.patching.patch_windows

        - name: Build report server
          ansible.builtin.include_role:
            name: demo.patching.report_windows_patching      

        - name: Fetch report
          ansible.builtin.fetch:
            src: "C:\\Temp\\windowspatch.html"
            dest: "/tmp/{{ inventory_hostname }}_windowspatch.html"
            flat: yes
          delegate_to: "{{ inventory_hostname }}"

        - name: Include SNOW role tasks
          ansible.builtin.include_role:
            name: snow_update
          vars:
            snow_attachments:
              - path: "/tmp/{{ inventory_hostname }}_windowspatch.html"
                name: "Patch Report - {{ now(fmt='%Y-%m-%d') }}.html"