---
- name: Windows updates
  hosts: all
  gather_facts: false

  tasks:
    - name: Patch Windows Server Block
      block:
        - name: Create Temp Directory
          ansible.windows.win_file:
            path: C:\Temp
            state: directory

        - name: Install Windows Updates
          ansible.windows.win_updates:
            category_names: "{{ win_update_categories | default(omit) }}"
            reboot: "false"
            accept_list: "{{ cve_required_updates }}"
            state: installed
          register: patching_result

        - name: Install KBs manually from the Microsoft Update Catalog
          when: patching_result.installed_update_count == 0
          block:
            - name: Ensure kbupdate PowerShell module is installed
              ansible.windows.win_powershell:
                error_action: stop
                script: |
                  $ErrorActionPreference = 'Stop'
                  $ProgressPreference = 'SilentlyContinue'
                  $Ansible.Changed = $false
                  if (-not (Get-Module -ListAvailable -Name kbupdate)) {
                    [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
                    Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
                    Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
                    Install-Module -Name kbupdate -Scope AllUsers -Force -AllowClobber -Confirm:$false
                    $Ansible.Changed = $true
                  }
                  if (-not (Get-Module -ListAvailable -Name kbupdate)) {
                    throw "kbupdate module is still not available after Install-Module"
                  }

            - name: Download KB files to C:\Temp
              ansible.windows.win_powershell:
                script: |
                  param($Kb, $Architecture)
                  $Ansible.Changed = $false
                  $status = [PSCustomObject]@{
                    KB     = $Kb
                    Status = 'AlreadyInstalled'
                    Files  = @()
                    Error  = $null
                  }
                  if (Get-HotFix -Id $Kb -ErrorAction SilentlyContinue) {
                    return $status
                  }
                  try {
                    Import-Module kbupdate -ErrorAction Stop
                    $files = Save-KbUpdate -Name $Kb -Path C:\Temp -Architecture $Architecture -ErrorAction Stop
                    if (-not $files) {
                      throw "No downloadable files found for $Kb"
                    }
                    $status.Status = 'Downloaded'
                    $status.Files = @($files | ForEach-Object { $_.FullName })
                    $Ansible.Changed = $true
                  }
                  catch {
                    $status.Status = 'Failed'
                    $status.Error = $_.Exception.Message
                  }
                  $status
                parameters:
                  Kb: "{{ item }}"
                  Architecture: "{{ kb_architecture | default('x64') }}"
              loop: "{{ cve_required_updates }}"
              register: kb_download

            - name: Sort KBs by download result
              ansible.builtin.set_fact:
                kb_download_ok: "{{ kb_download_results | selectattr('Status', 'equalto', 'Downloaded') | list }}"
                kb_download_failed: "{{ kb_download_results | selectattr('Status', 'equalto', 'Failed') | list }}"
              vars:
                kb_download_results: "{{ kb_download.results | map(attribute='output') | flatten }}"

            - name: Set KB Facts
              ansible.builtin.set_fact:
                kb_download_installed: "{{ kb_download_ok | map(attribute='KB') | list }}"
                kb_download_failed: "{{ kb_download_failed | map(attribute='KB') | list }}"
            
            - name: Set failed downloads as stat
              ansible.builtin.set_stats:
                data:
                  kb_failed: "{{ kb_download_failed }}"
                  kb_installed: "{{ kb_download_installed  }}"
                  
            - name: Report KBs that could not be downloaded
              when: kb_download_failed | length > 0
              block:
                - name: Warn about failed downloads
                  ansible.builtin.debug:
                    msg: "{{ item }} could not be downloaded"
                  loop: "{{ kb_download_failed }}"
                  loop_control:
                    label: "{{ item }}"

                - name: Set failed downloads as stat
                  ansible.builtin.set_stats:
                    data:
                      kb_failed: "{{ kb_download_failed }}"
                      kb_installed: "{{ kb_download_installed }}"

            - name: Install downloaded KB files
              ansible.windows.win_powershell:
                script: |
                  param($Path)
                  $result = Add-WindowsPackage -Online -PackagePath $Path -NoRestart
                  [PSCustomObject]@{
                    Path          = $Path
                    RestartNeeded = [bool]$result.RestartNeeded
                  }
                parameters:
                  Path: "{{ item }}"
              loop: "{{ kb_download_ok | map(attribute='Files') | flatten }}"
              register: kb_manual_install

        - name: Build Patch Report
          when: patching_result.installed_update_count > 0
          block:
            - name: Build report server
              ansible.builtin.include_role:
                name: demo.patching.report_windows_patching      
    
            - name: Fetch report
              ansible.builtin.fetch:
                src: "C:\\Temp\\windowspatch.html"
                dest: "/tmp/{{ inventory_hostname }}_windowspatch.html"
                flat: yes
              delegate_to: "{{ inventory_hostname }}"

            - name: Include SNOW role tasks
              ansible.builtin.include_role:
                name: snow_update
              vars:
                snow_attachments:
                  - path: "/tmp/{{ inventory_hostname }}_windowspatch.html"
                    name: "Patch Report - {{ now(fmt='%Y-%m-%d') }}.html"

        - name: Update Ticket
          when: patching_result.installed_update_count == 0
          ansible.builtin.include_role:
            name: snow_update