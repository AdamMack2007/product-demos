- name: Set Workflow Vars as fact
  when: ao_workflow_name == "win_disk_job"
  ansible.builtin.set_fact:
    ao_url: "https://orchestrator.apps.mackdev.net/api/v1/webhooks/eda/dce2d552-2b2d-4e90-bd6b-6793b6b09a42"
    ao_vars:
      event_status: "{{ ansible_eda.event.payload.event_status }}"
      event_name: "{{ ansible_eda.event.payload.event_name }}"
      disk: "{{ ansible_eda.event.payload.disk }}"
      host: "{{ ansible_eda.event.payload.hostname }}"
      alert_service: "Dynatrace"

- name: Set Workflow Vars as fact
  when: ao_workflow_name == "win_cve_job"
  ansible.builtin.set_fact:
    ao_url: "https://orchestrator.apps.mackdev.net/api/v1/webhooks/15735822-b025-4555-aaa9-d1c86ebde1dd"
    ao_vars:
      host: "{{ ansible_eda.event.payload.host }}"
      cve_id: "{{ ansible_eda.event.payload.cve_id }}"
      ritm: "{{ ansible_eda.event.payload.ritm }}"

- name: Obtain OAuth token
  ansible.builtin.uri:
    url: "{{ webhook_url_base }}/api/v1/auth/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ oauth_client_id }}"
      client_secret: "{{ oauth_client_secret }}"
    status_code: 200
  register: token_response

- name: Post event payload to AO Webhook
  ansible.builtin.uri:
    url: "{{ ao_url }}"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ token_response.json.access_token }}"
      Content-Type: application/json
    body: "{{ ao_vars }}"
    status_code: 202
  register: webhook_response
